{% extends "base.html" %}

{% block title %}Log Activity - LIFE SYSTEM{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Log Today's Activity</h1>
            <p>Record what you actually did</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="activity">Activity Name</label>
                <input 
                    type="text" 
                    id="activity" 
                    name="activity" 
                    placeholder="e.g., Studied Python"
                    required
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="actual_start">Start Time</label>
                    <input 
                        type="time" 
                        id="actual_start" 
                        name="actual_start"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="actual_end">End Time</label>
                    <input 
                        type="time" 
                        id="actual_end" 
                        name="actual_end"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="">Select status</option>
                    <option value="completed">✅ Completed</option>
                    <option value="in_progress">🔄 In Progress</option>
                    <option value="postponed">⏸️ Postponed</option>
                    <option value="cancelled">❌ Cancelled</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Notes (Optional)</label>
                <textarea 
                    id="notes" 
                    name="notes" 
                    placeholder="Add any notes about this activity"
                    rows="4"
                ></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Log Activity</button>
                <a href="/dashboard" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

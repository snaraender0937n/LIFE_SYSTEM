{% extends "base.html" %}

{% block title %}Add Plan - LIFE SYSTEM{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Add Today's Plan</h1>
            <p>Plan your activities for today</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="activity">Activity Name</label>
                <input 
                    type="text" 
                    id="activity" 
                    name="activity" 
                    placeholder="e.g., Study Python, Complete Project"
                    required
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="planned_start">Start Time</label>
                    <input 
                        type="time" 
                        id="planned_start" 
                        name="planned_start"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="planned_end">End Time</label>
                    <input 
                        type="time" 
                        id="planned_end" 
                        name="planned_end"
                        required
                    >
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Plan</button>
                <a href="/dashboard" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block page_class %}page-add-plan{% endblock %}
{% block title %}Add Plan - LIFE SYSTEM{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Add Complex Task</h1>
            <p>Plan with sub-steps, difficulty, and energy level</p>
        </div>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="activity">Activity Name *</label>
                <input 
                    type="text" 
                    id="activity" 
                    name="activity" 
                    placeholder="e.g., Study Python, Complete Project"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="2" placeholder="What does done look like?"></textarea>
            </div>

            <div class="form-group">
                <label for="subtasks">Subtasks (one per line)</label>
                <textarea id="subtasks" name="subtasks" rows="4" placeholder="Research topic&#10;Draft outline&#10;Finish slides"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="planned_start">Start Time *</label>
                    <input 
                        type="time" 
                        id="planned_start" 
                        name="planned_start"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="planned_end">End Time *</label>
                    <input 
                        type="time" 
                        id="planned_end" 
                        name="planned_end"
                        required
                    >
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority">
                        <option value="low">🟢 Low</option>
                        <option value="medium" selected>🟡 Medium</option>
                        <option value="high">🔴 High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="general">General</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                        <option value="exercise">Exercise</option>
                        <option value="health">Health</option>
                        <option value="personal">Personal</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="difficulty">Difficulty (1-5)</label>
                    <input type="number" id="difficulty" name="difficulty" min="1" max="5" value="3">
                </div>
                <div class="form-group">
                    <label for="energy_level">Energy needed</label>
                    <select id="energy_level" name="energy_level">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="form-group" style="display:flex;align-items:flex-end;">
                    <label><input type="checkbox" name="is_recurring" value="1"> Recurring weekly</label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Plan</button>
                <a href="/dashboard" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

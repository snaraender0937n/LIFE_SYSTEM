<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body class="login-page">

    <div class="container">

        <h1>LIFE SYSTEM</h1>

        <h2>Login</h2>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <div class="password-box">

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Password"
                    required
                >

                <span class="show-toggle" onclick="toggleLoginPassword()">
                    SHOW
                </span>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <br>

        <a href="/register">
            Create Account
        </a>

    </div>

<script>

function toggleLoginPassword() {

    let password =
        document.getElementById("loginPassword");

    if (password.type === "password") {

        password.type = "text";

    }

    else {

        password.type = "password";

    }
}

</script>

</body>

</html>
